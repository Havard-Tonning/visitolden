<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <script src="../js/script.js"></script>
<title>Kontakt oss</title>
</head>
<body>
    <div class="mainHeader">
                <a href="../index.html"><h1 class="logo">Visit Olden</h1></a>        <button class="hamburger" aria-label="Meny" aria-expanded="false">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
        <nav>
            <a href="../index.html" class="linkBox">Hjem</a>
            <a href="overnatting.html" class="linkBox">Overnatting</a>
            <a href="arrangement.html" class="linkBox">Arrangement</a>
            <a href="butikker.html" class="linkBox">Butikker</a>
            <a href="spise.html" class="linkBox">Spisesteder</a>
            <a href="todo.html" class="linkBox">Ting å gjøre</a>
            <a href="kontakt.html" class="linkBox active">Kontakt</a>
        </nav>
    </div>

    <!-- Hero Section -->
    <div class="hero-section">
        <img src="../bilder/olden.jpg" class="hero-image" alt="Olden">
        <div class="hero-overlay">
            <div class="hero-content">
                <h1 class="hero-title">Kontakt oss</h1>
                <p class="hero-text">Vi hjelper deg gjerne med spørsmål om Olden eller overnatting</p>
            </div>
        </div>
    </div>

    <!-- Contact Content -->
    <div class="content-wrapper">
        <!-- Contact Form -->
        <div class="aptForm">
            <h2>Send oss en melding</h2>
            <hr>
            <form action="https://api.web3forms.com/submit" method="POST" class="contactForm">
                <input type="hidden" name="access_key" value="4f4f47b5-b5b4-4bf0-a068-8419dcecea37">
                <input type="text" value="Generelt" name="bookingtype" hidden>

                <div class="form-group">
                    <label for="name" class="form-label">Navn</label>
                    <input type="text" name="name" class="form-name" required>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">E-post</label>
                    <input type="email" name="email" class="form-email" required>
                </div>

                <div class="form-group">
                    <label for="message" class="form-label">Melding</label>
                    <textarea name="message" class="form-message" required placeholder="Skriv din melding her"></textarea>
                </div>

                <input type="checkbox" name="botcheck" class="hidden" style="display: none;">
                <button type="submit" class="submit-button">Send melding</button>
            </form>
        </div>
    </div>
</body>
</html>
