    <!-- Contact Content -->
    <div class="content-wrapper">
        <!-- Contact Form -->
        <div class="aptForm">
            <h2>Send us a message</h2>
            <hr>
            <form action="https://api.web3forms.com/submit" method="POST" class="contactForm">
                <input type="hidden" name="access_key" value="26392e9d-b6a8-4eaa-be26-5131a1a645e9">
                <input type="text" value="Generelt" name="bookingtype" hidden>

                <div class="form-group">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" name="name" class="form-name" required>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" name="email" class="form-email" required>
                </div>

                <div class="form-group">
                    <label for="phone" class="form-label">Phone/WhatsApp</label>
                    <input type="phone" id="phone" name="phone" class="form-phone" required>
                </div>

                <div class="form-group">
                    <label for="message" class="form-label">Message</label>
                    <textarea name="message" class="form-message" required
                        placeholder="Write your message here"></textarea>
                </div>

                <input type="checkbox" name="botcheck" class="hidden" style="display: none;">
                <button type="submit" class="submit-button">Send message</button>
            </form>
        </div>
    </div>
